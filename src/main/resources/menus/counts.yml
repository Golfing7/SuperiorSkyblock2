title: '&lIsland Block Counts'
previous-menu: true

pattern:
  - '@ @ @ @ @ @ @ @ @'
  - '@ @ @ @ @ @ @ @ @'
  - '@ @ @ @ @ @ @ @ @'
  - '@ @ @ @ @ @ @ @ @'
  - '$ $ $ $ $ $ $ $ $'
  - '# # % # * # ^ # #'

slots: '@'
previous-page: '%'
current-page: '*'
next-page: '^'

# Level breakdown shown for leveled spawners, in place of the {6} placeholder in the '@' item's lore.
# The lines are only added for spawners that have level data (requires a spawners provider with leveled
# spawners, e.g. DecypherCore). For any other block, the {6} line is removed from the lore.
# Level data is refreshed when the island's worth is recalculated.
spawner-levels:
  # Line shown above the breakdown. Set to '' to hide it.
  # {0} - The max level of the spawner.
  header: '&6&l* &e&lSpawner Levels:'
  # Line shown for each level the island has spawners at.
  # {0} - The level.
  # {1} - The amount of spawners at that level.
  # {2} - The worth of those spawners (scaled by level if spawners-worth-scaled-by-level is enabled).
  # {3} - The worth of those spawners, in fancy format.
  # {4} - The max level of the spawner.
  # {5} - The island level value of those spawners.
  # {6} - The island level value of those spawners, in fancy format.
  line: '&7  - Level {0}/{4}: &fx{1} &7(${2})'

items:
  '@':
    type: STONE
    name: '&e{0}'
    lore:
      - '&6&l* &e&lQuantity &fx{1}'
      - '&6&l* &e&lWorth: &f${2}'
      - '&6&l* &e&lLevel: &f${3}'
      - '{6}'
    flags:
      - HIDE_ATTRIBUTES
  '%':
    type: PAPER
    name: '{0}Previous Page'
  '*':
    type: DOUBLE_PLANT
    name: '&aCurrent Page'
    lore:
      - '&7Page {0}'
  '^':
    type: PAPER
    name: '{0}Next Page'
  '$':
    type: STAINED_GLASS_PANE
    data: 15
    name: '&f'