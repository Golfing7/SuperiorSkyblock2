title: '&lChest Logs &r{0}'
previous-menu: true

pattern:
  - '@ @ @ @ @ @ @ @ @'
  - '@ @ @ @ @ @ @ @ @'
  - '@ @ @ @ @ @ @ @ @'
  - '@ @ @ @ @ @ @ @ @'
  - '$ $ $ ! $ - $ $ $'
  - '# # % # * # ^ # #'

slots: '@'
previous-page: '%'
current-page: '*'
next-page: '^'

time-sort: '!'
amount-sort: '-'

items:
  # The type of this item is replaced with the item of the transaction,
  # and its amount with the amount of items that were added/removed.
  '@':
    type: PAPER
    name: '&eTransaction #{0}'
    lore:
      - '&7Player: {1}'
      - '&7Action: {2}'
      - '&7Time: {3}'
      - '&7Item: &f{5} &7x{4}'
      - '&7Chest: &f#{6}'
      - ''
      - '&7Click to filter transactions by this player.'
  '%':
    type: PAPER
    name: '{0}Previous Page'
  '*':
    type: SUNFLOWER
    name: '&aCurrent Page'
    lore:
      - '&7Page {0}'
  '^':
    type: PAPER
    name: '{0}Next Page'
  '$':
    type: BLACK_STAINED_GLASS_PANE
    name: '&f'
  '!':
    type: CLOCK
    name: '&6Sort by creation time'
  '-':
    type: CHEST
    name: '&6Sort by amount'

sounds:
  '@':
    type: BLOCK_CHEST_OPEN
    volume: 0.8
    pitch: 1
